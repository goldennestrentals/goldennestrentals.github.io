<title>Hearthstead</title>
<style>
:root{
  --ink:#1d2433; --muted:#667085; --line:#e4e7ec; --bg:#f7f6f3; --card:#fff;
  --brand:#1f6f5c; --brand-2:#e8f3ef; --accent:#e07a3f; --radius:14px;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 16px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}

/* Header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:#fff}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.top-inner{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;letter-spacing:-.02em;text-decoration:none}
.logo svg{width:30px;height:30px}
.nav{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#cfd4dc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#185a4a}
.btn.ghost{border-color:transparent}
.fav-count{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:99px;background:var(--accent);color:#fff;font-size:12px;text-align:center}

/* Hero / search */
.hero{background:linear-gradient(135deg,#1f6f5c 0%,#2c8a73 60%,#3c9d83 100%);color:#fff}
.hero-inner{max-width:1400px;margin:0 auto;padding:36px 20px 28px}
.hero h1{margin:0 0 4px;font-size:clamp(24px,3.4vw,38px);letter-spacing:-.02em}
.hero p{margin:0 0 18px;opacity:.9}
.searchbar{display:flex;gap:8px;background:#fff;border-radius:999px;padding:6px;box-shadow:var(--shadow);max-width:760px}
.searchbar input{flex:1;border:0;outline:0;padding:10px 16px;border-radius:999px;min-width:0;color:var(--ink)}
.searchbar .btn{padding:10px 22px}

/* Filters */
.filters{position:sticky;top:61px;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.filters-inner{max-width:1400px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input[type=number]{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer}
.filters input[type=number]{width:110px;cursor:text}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;cursor:pointer;user-select:none}
.chip[aria-pressed=true]{background:var(--brand-2);border-color:var(--brand);color:var(--brand);font-weight:600}
.filters .spacer{flex:1}
.view-toggle{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.view-toggle button{border:0;background:#fff;padding:7px 14px;cursor:pointer}
.view-toggle button[aria-pressed=true]{background:var(--ink);color:#fff}

/* Layout */
main{max-width:1400px;margin:0 auto;padding:16px 20px 60px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px}
main.list-only{grid-template-columns:1fr}
main.list-only .map-wrap{display:none}
main.map-only .results{display:none}
main.map-only{grid-template-columns:1fr}
.map-wrap{position:sticky;top:122px;height:calc(100vh - 140px);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);background:#dfeae4}
.results-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.results-head h2{margin:0;font-size:18px}
.results-head .muted{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

/* Card */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;outline:2px solid transparent}
.card:hover,.card.hl{transform:translateY(-2px);box-shadow:0 8px 28px rgba(16,24,40,.12)}
.card.hl{outline-color:var(--brand)}
.card .ph{position:relative;aspect-ratio:16/10;overflow:hidden}
.card .ph svg{width:100%;height:100%;display:block}
.badge{position:absolute;left:10px;top:10px;background:#fff;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700}
.badge.new{background:var(--accent);color:#fff}
.badge.hot{background:#b42318;color:#fff}
.card .ph img,.modal .gallery img{width:100%;height:100%;object-fit:cover;display:block}
.modal .gallery.one{grid-template-columns:1fr;grid-template-rows:1fr}
.pop{font-size:12px;color:var(--muted);margin-top:2px}
.heart{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer}
.heart svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2}
.heart[aria-pressed=true] svg{fill:var(--accent);stroke:var(--accent)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.price{font-size:20px;font-weight:800;letter-spacing:-.01em}
.price small{font-size:13px;font-weight:500;color:var(--muted)}
.specs{display:flex;gap:10px;color:var(--ink);font-size:14px}
.addr{color:var(--muted);font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;background:#f2f4f7;border-radius:6px;padding:2px 8px;color:#475467}
.empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border-radius:var(--radius)}

/* Map */
.map-svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
.map-svg:active{cursor:grabbing}
.map-svg .water{fill:#bcd7e6}
.map-svg .land{fill:#eef1ea;stroke:#9fb3a3;stroke-width:1;vector-effect:non-scaling-stroke}
.map-svg .boro{font-size:12px;font-weight:700;letter-spacing:2px;fill:#7d8f80;pointer-events:none}
.pin path{fill:var(--brand)}
.map-zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;background:#fff;border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.map-zoom button{width:36px;height:36px;border:0;border-bottom:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.map-zoom button:last-child{border-bottom:0}
.map-zoom button:hover{background:#f2f4f7}
.pin{cursor:pointer}
.pin rect{fill:#fff;stroke:var(--brand);stroke-width:1.5}
.pin text{font-size:12px;font-weight:700;fill:var(--ink)}
.pin:hover rect,.pin.hl rect{fill:var(--brand)}
.pin:hover text,.pin.hl text{fill:#fff}
.map-legend{position:absolute;left:12px;bottom:12px;background:#fff;border-radius:8px;padding:6px 10px;font-size:12px;color:var(--muted);box-shadow:var(--shadow)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 16px}
.modal{background:#fff;border-radius:18px;max-width:960px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .gallery{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr;gap:4px;height:min(56vw,380px)}
.modal .gallery > div:first-child{grid-row:1/3}
.modal .gallery svg{width:100%;height:100%;display:block}
.modal .close{position:absolute;right:12px;top:12px}
.modal-body{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:28px;padding:22px 24px 28px}
.modal h2{margin:0;font-size:24px;letter-spacing:-.01em}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.fact{background:#f7f8fa;border-radius:10px;padding:10px;text-align:center}
.fact b{display:block;font-size:18px}
.fact span{font-size:12px;color:var(--muted)}
.amen{columns:2;padding-left:18px;margin:8px 0}
.contact{border:1px solid var(--line);border-radius:14px;padding:16px;align-self:start;position:sticky;top:0}
.contact label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
.contact input,.contact textarea,.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff}
.contact textarea{min-height:80px;resize:vertical}
.side{display:flex;flex-direction:column;gap:14px;align-self:start}
.side .contact{position:static}
.pay{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.pay-row{display:flex;justify-content:space-between;font-size:14px;font-variant-numeric:tabular-nums}
.pay-row.total{border-top:1px solid var(--line);padding-top:8px;font-size:15px}
.pay .btn{display:block;width:100%;text-align:center;text-decoration:none;margin-top:6px;white-space:normal}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.fine{margin:4px 0 0;font-size:12px;color:var(--muted)}
.ok{background:var(--brand-2);color:var(--brand);padding:12px;border-radius:10px;font-weight:600}
.form{padding:24px}
.form .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.form label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
.amen-pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.amen-pick label{display:flex;gap:6px;align-items:center;font-weight:400;margin:0;border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer}

.chat{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.chat-btn{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:12px 18px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 6px 20px rgba(16,24,40,.25)}
.chat-btn:hover{background:#185a4a}
.chat-btn svg{width:18px;height:18px;fill:#fff}
.chat-menu{width:min(300px,calc(100vw - 32px));background:#fff;border-radius:16px;padding:16px;box-shadow:0 12px 40px rgba(16,24,40,.25);display:flex;flex-direction:column;gap:8px}
.chat-menu .btn{display:block;text-align:center;text-decoration:none;width:100%}
.chat-menu .btn.wa{background:#1f8f4e;border-color:#1f8f4e;color:#fff}
.chat-about{margin:0;font-size:13px;background:var(--brand-2);color:var(--brand);border-radius:8px;padding:6px 10px}
footer{border-top:1px solid var(--line);background:#fff;color:var(--muted);font-size:13px}
footer .inner{max-width:1400px;margin:0 auto;padding:20px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}

@media (max-width:900px){
  main{grid-template-columns:1fr}
  main:not(.map-only) .map-wrap{display:none}
  main.map-only .map-wrap{position:relative;top:0;height:70vh}
  .modal-body{grid-template-columns:1fr}
  .filters{top:0;position:relative}
  .nav .hide-sm{display:none}
}
@media (max-width:520px){
  .facts{grid-template-columns:repeat(2,1fr)}
  .amen{columns:1}
  .modal .gallery{grid-template-columns:1fr;grid-template-rows:1fr}
  .modal .gallery > div:not(:first-child){display:none}
}
</style>
</head>

/* ---------- Filtering ---------- */
function filtered(){
  const q = $("#q").value.trim().toLowerCase();
  const min = +$("#minPrice").value || 0, max = +$("#maxPrice").value || Infinity;
  const beds = +$("#beds").value, baths = +$("#baths").value, boro = $("#borough").value;
  let out = listings.filter(l =>
    (!q || [l.addr,l.hood,l.borough,l.zip,l.title].join(" ").toLowerCase().includes(q)) &&
    l.price >= min && l.price <= max && l.beds >= beds && l.baths >= baths &&
    (!boro || l.borough === boro) && [...flags].every(f => l[f]) && (!onlyFavs || favs.has(l.id)));
  const s = $("#sort").value;
  out.sort(s==="low" ? (a,b)=>a.price-b.price : s==="high" ? (a,b)=>b.price-a.price : s==="sqft" ? (a,b)=>b.sqft-a.sqft :
    s==="popular" ? (a,b)=>(score(b.id)-score(a.id)) || (a.days-b.days) : (a,b)=>a.days-b.days);
  return out;
}

/* ---------- Popularity: real view and save counts, shared by everyone ----------
   Each signed-in visitor keeps one record (activity/<their id>) listing the houses
   they opened and saved. Counts = how many different people viewed / saved a house. */
const demand = {};          // id -> {views, saves}
const mine = {viewed:new Set(), saved:new Set()};
let actDoc = null, writing = false, dirty = false;
const stat = id => demand[id] || {views:0, saves:0};
const score = id => { const s = stat(id); return s.views + 3*s.saves; };
function inDemand(id){
  const top = listings.map(l=>score(l.id)).filter(v=>v>0).sort((a,b)=>b-a);
  return score(id) > 0 && score(id) >= (top[Math.min(2, top.length-1)] || Infinity);
}
async function saveActivity(){
  if(!actDoc) return;
  if(writing){ dirty = true; return; }
  writing = true;
  try{ await actDoc.set({viewed:[...mine.viewed], saved:[...mine.saved]}); }
  catch(e){ if(e && e.code==="invalid_argument") actDoc = null; }   // this visitor can't record activity
  writing = false;
  if(dirty){ dirty = false; saveActivity(); }
}
function track(kind, id, on=true){
  const set = kind==="view" ? mine.viewed : mine.saved;
  const had = set.has(id); on ? set.add(id) : set.delete(id);
  if(had !== on) saveActivity();
}
function noDemand(){   // counting isn't available on this host: hide the option
  const o = document.querySelector('#sort option[value="popular"]');
  if(o){ if($("#sort").value==="popular") $("#sort").value="new"; o.remove(); render(); }
}
(async function initDemand(){
  if(!window.claude || !window.claude.use) return setTimeout(noDemand);
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if(!db) return noDemand();
  const uid = user ? await user.id() : null;
  if(uid){
    try{
      actDoc = db.doc("activity/" + uid);
      const snap = await actDoc.get();
      if(snap.exists){ const d = snap.data(); (d.viewed||[]).forEach(i=>mine.viewed.add(i)); (d.saved||[]).forEach(i=>mine.saved.add(i)); }
    }catch{ actDoc = null; }
  }
  db.collection("activity").onSnapshot(snap=>{
    Object.keys(demand).forEach(k=>delete demand[k]);
    snap.docs.forEach(doc=>{
      const d = doc.data() || {};
      (Array.isArray(d.viewed)?d.viewed:[]).forEach(i=>{ demand[i] = demand[i]||{views:0,saves:0}; demand[i].views++; });
      (Array.isArray(d.saved)?d.saved:[]).forEach(i=>{ demand[i] = demand[i]||{views:0,saves:0}; demand[i].saves++; });
    });
    render();
  }, ()=>{});
})();

function render(){
  const items = filtered();
  const q = $("#q").value.trim();
  $("#resultsTitle").textContent = onlyFavs ? "Your saved houses" : `Houses for rent in ${q || $("#borough").value || "New York, NY"}`;
  $("#resultsCount").textContent = `${items.length} ${items.length===1?"rental":"rentals"} available`;
  $("#grid").innerHTML = items.length ? items.map(card).join("") :
    `<div class="empty">No houses match these filters. Try widening your price range or removing a filter.</div>`;
  renderMap(items);
  $("#favCount").textContent = favs.size;
}

function card(l){
  const tags = Object.keys(AMENITIES).filter(k=>l[k]).map(k=>`<span class="tag">${AMENITIES[k]}</span>`).join("");
  const s = stat(l.id);
  const badge = inDemand(l.id) ? '<span class="badge hot">In demand</span>' :
    l.days<=2 ? '<span class="badge new">New</span>' : `<span class="badge">${esc(l.type)}</span>`;
  const pop = (s.views||s.saves) ? `<div class="pop">${s.views} ${s.views===1?"person":"people"} viewed · ${s.saves} saved</div>` : "";
  return `<article class="card" data-id="${l.id}" tabindex="0">
    <div class="ph">${photo(l)}
      ${badge}
      <button class="heart" data-fav="${l.id}" aria-label="Save" aria-pressed="${favs.has(l.id)}"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3.3 5 7 5c2 0 3.5 1.2 5 3 1.5-1.8 3-3 5-3 3.7 0 5.8 3.6 4.5 6.8C19.5 16.4 12 21 12 21z"/></svg></button>
    </div>
    <div class="body">
      <div class="price">${fmt(l.price)} <small>/mo</small></div>
      <div class="specs"><b>${l.beds}</b> bd · <b>${l.baths}</b> ba · ${l.sqft.toLocaleString()} sqft</div>
      <div class="addr">${esc(l.addr)}, ${esc(l.hood)}, ${esc(l.borough)} ${esc(l.zip)}</div>
      <div class="tags">${tags}</div>
      ${pop}
    </div>
  </article>`;
}
function photo(l){
  return l.photo ? `<img src="${esc(l.photo)}" alt="${esc(l.title)}" loading="lazy">` : houseSVG(l.hue);
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

    `<path class="land" data-boro="${name}" d="${rings.map(r=>"M"+r.map(([lng,lat])=>proj(lat,lng).map(v=>v.toFixed(2)).join(",")).join("L")+"Z").join("")}"/>`).join("");
}
function fitMap(){
  const svg = $("#map"), r = svg.getBoundingClientRect();
  if(!r.width || !r.height) return;
  view.w = r.width; view.h = r.height;
  svg.setAttribute("viewBox", `0 0 ${view.w} ${view.h}`);
  const [x0,y0] = proj(40.92,-74.26), [x1,y1] = proj(40.49,-73.70);
  view.k = Math.min(view.w/(x1-x0), view.h/(y1-y0)) * 0.95;
  view.tx = (view.w - (x1-x0)*view.k)/2 - x0*view.k;
  view.ty = (view.h - (y1-y0)*view.k)/2 - y0*view.k;
  view.fitted = true;
}
let mapItems = [];
function renderMap(items){
  if(items) mapItems = items;
  const svg = $("#map");
  if(!view.fitted) fitMap();
  const scr = (lat,lng) => { const [x,y] = proj(lat,lng); return [x*view.k+view.tx, y*view.k+view.ty]; };
  const labels = Object.entries(BORO_LABELS).map(([n,[la,ln]])=>{ const [x,y]=scr(la,ln); return `<text class="boro" x="${x}" y="${y}" text-anchor="middle">${n.toUpperCase()}</text>`; }).join("");
  const pins = mapItems.filter(l=>l.lat).map(l=>{
    const label = l.price>=10000 ? `$${(l.price/1000).toFixed(0)}k` : `$${(l.price/1000).toFixed(1)}k`;
    const w = label.length*8+14, [x,y] = scr(l.lat,l.lng);
    return `<g class="pin" data-id="${l.id}" transform="translate(${(x-w/2).toFixed(1)},${(y-28).toFixed(1)})"><rect width="${w}" height="24" rx="12"/><path d="M${w/2-5} 23 L${w/2} 29 L${w/2+5} 23z"/><text x="${w/2}" y="16" text-anchor="middle">${label}</text></g>`;
  }).join("");
  svg.innerHTML = `<rect class="water" width="100%" height="100%"/><g transform="translate(${view.tx},${view.ty}) scale(${view.k})">${landPaths}</g>${labels}${pins}`;
}
function zoomAt(f, cx, cy){
  const k = Math.min(Math.max(view.k*f, 0.3), 40);
  f = k/view.k; view.tx = cx - (cx-view.tx)*f; view.ty = cy - (cy-view.ty)*f; view.k = k; renderMap();
}
let dragMoved = false;
(function mapControls(){
  const svg = $("#map"), pts = new Map(); let last = null, pinchD = 0;
  const pos = e => { const r = svg.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  svg.addEventListener("pointerdown", e=>{ pts.set(e.pointerId,pos(e)); last = pos(e); dragMoved = false; pinchD = 0; });
  svg.addEventListener("pointermove", e=>{
    if(!pts.has(e.pointerId)) return;
    const p = pos(e); pts.set(e.pointerId,p);
    if(pts.size===2){
      const [a,b] = [...pts.values()], d = Math.hypot(a[0]-b[0],a[1]-b[1]);
      if(pinchD) zoomAt(d/pinchD, (a[0]+b[0])/2, (a[1]+b[1])/2);
      pinchD = d; dragMoved = true; return;
    }
    const dx = p[0]-last[0], dy = p[1]-last[1];
    if(!dragMoved && Math.hypot(dx,dy) < 4) return;
    if(!dragMoved) svg.setPointerCapture(e.pointerId);
    dragMoved = true; view.tx += dx; view.ty += dy; last = p; renderMap();
  });
  const up = e=>{ pts.delete(e.pointerId); pinchD = 0; if(pts.size===1) last = [...pts.values()][0]; };
  svg.addEventListener("pointerup", up); svg.addEventListener("pointercancel", up);
  svg.addEventListener("wheel", e=>{ e.preventDefault(); const [x,y]=pos(e); zoomAt(Math.exp(-e.deltaY*0.002), x, y); }, {passive:false});
  document.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click", ()=>{
    const z = b.dataset.zoom; if(z==="reset"){ view.fitted=false; renderMap(); } else zoomAt(z==="in"?1.5:1/1.5, view.w/2, view.h/2);
  }));
  new ResizeObserver(()=>{ view.fitted = false; renderMap(); }).observe(svg);
})();
function highlight(id,on){
  document.querySelectorAll(`[data-id="${id}"]`).forEach(el=>el.classList.toggle("hl",on));
}

/* ---------- Detail modal ---------- */
function openDetail(id){
  const l = listings.find(x=>x.id==id); if(!l) return;
  track("view", l.id);
  const am = Object.keys(AMENITIES).filter(k=>l[k]).map(k=>`<li>${AMENITIES[k]}</li>`).join("") + "<li>Central heating</li><li>Dishwasher</li>";
  showModal(`<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(l.title)}" style="position:relative">
    ${l.photo ? `<div class="gallery one"><div>${photo(l)}</div></div>` :
      `<div class="gallery"><div>${houseSVG(l.hue,0)}</div><div>${houseSVG(l.hue,1)}</div><div>${houseSVG(l.hue,2)}</div></div>`}
    <button class="btn close" data-close>✕ Close</button>
    <div class="modal-body">
      <div>
        <h2>${esc(l.title)}</h2>
        <div class="addr">${esc(l.addr)}, ${esc(l.hood)}, ${esc(l.borough)}, NY ${esc(l.zip)}</div>
        ${l.photoBy ? `<div class="fine">Example photo by ${esc(l.photoBy)} on Unsplash</div>` : ""}
        <div class="price" style="margin-top:8px">${fmt(l.price)} <small>/mo</small></div>
        <div class="facts">
          <div class="fact"><b>${l.beds}</b><span>Bedrooms</span></div>
          <div class="fact"><b>${l.baths}</b><span>Bathrooms</span></div>
          <div class="fact"><b>${l.sqft.toLocaleString()}</b><span>Sq ft</span></div>
          <div class="fact"><b>${l.days===0?"Today":l.days+"d"}</b><span>Listed</span></div>
        </div>
        <h3>About this house</h3>
        <p>${esc(l.desc)}</p>
        <h3>Amenities</h3>
        <ul class="amen">${am}</ul>
        <a class="btn" style="display:inline-block;text-decoration:none;margin-top:4px" target="_blank" rel="noopener noreferrer"
           href="https://www.google.com/maps/search/?api=1&amp;query=${encodeURIComponent(`${l.addr}, ${l.borough}, NY ${l.zip}`)}">Open in Google Maps ↗</a>
        <h3>Lease terms</h3>
        <p>12-month lease · Security deposit ${fmt(l.price)} · ${esc(l.type)} · Available now</p>
      </div>
      <div class="side">
      <form class="contact" id="contactForm">
        <b>Contact the property manager</b>
        <label for="cName">Name</label><input id="cName" required>
        <label for="cEmail">Email</label><input id="cEmail" type="email" required>
        <label for="cMove">Move-in date</label><input id="cMove" type="date">
        <label for="cMsg">Message</label><textarea id="cMsg">Hi, I'm interested in ${esc(l.addr)}. Is it still available?</textarea>
        <button class="btn primary" style="width:100%;margin-top:12px" type="submit">Send request</button>
        ${chatReady() ? `<button class="btn" style="width:100%;margin-top:8px" type="button" data-chat="${l.id}">Chat about this house</button>` : ""}
        <button class="btn" style="width:100%;margin-top:8px" type="button" data-fav="${l.id}" aria-pressed="${favs.has(l.id)}">${favs.has(l.id)?"♥ Saved":"♡ Save house"}</button>
      </form>
      ${payBox(l)}
      </div>
    </div>
  </div>`);
  $("#contactForm").addEventListener("submit", e=>{
    e.preventDefault();
    e.target.innerHTML = `<div class="ok">Request sent! The property manager will reply to ${esc($("#cEmail").value)} soon.</div>`;
  });
}

/* ---------- Payment box ---------- */
function payUrl(link, l){
  try{
    const u = new URL(link);
    if(!/^https:$/.test(u.protocol)) return "";
    // Stripe Payment Links record which house was paid for (shows in your Stripe dashboard)
    if(u.hostname === "buy.stripe.com") u.searchParams.set("client_reference_id", "listing-" + l.id);
    return u.toString();
  }catch{ return ""; }
}
function payButton(link, label, l, primary){
  const url = link ? payUrl(link, l) : "";
  if(!url) return `<button class="btn" type="button" disabled>${label} · online payment coming soon</button>`;
  return `<a class="btn ${primary?"primary":""}" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`;
}
function payBox(l){
  const fee = PAYMENTS.applicationFee.amount;
  const deposit = l.price * PAYMENTS.depositMonths;
  const due = l.price + deposit;
  const ownLink = l.payLinks && l.payLinks.moveIn;
  const moveLink = ownLink || PAYMENTS.moveIn.link;
  const hint = (!ownLink && moveLink) ? `<p class="fine">At checkout, enter <b>${fmt(due)}</b> as the amount.</p>` : "";
  return `<div class="pay">
    <b>Apply and pay online</b>
    <div class="pay-row"><span>Application fee</span><b>${fmt(fee)}</b></div>
    ${payButton(PAYMENTS.applicationFee.link, `Pay ${fmt(fee)} application fee`, l, false)}
    <div class="pay-row" style="margin-top:12px"><span>First month's rent</span><b>${fmt(l.price)}</b></div>
    <div class="pay-row"><span>Security deposit</span><b>${fmt(deposit)}</b></div>
    <div class="pay-row total"><span>Due at move-in</span><b>${fmt(due)}</b></div>
    ${payButton(moveLink, `Pay ${fmt(due)} move-in costs`, l, true)}
    ${hint}
    <p class="fine">Payment opens on a secure checkout page. Card details are never entered on this site.</p>
  </div>`;
}

function openListForm(){
  showModal(`<div class="modal" role="dialog" aria-modal="true" aria-label="List your house" style="position:relative;max-width:680px">
    <button class="btn close" data-close>✕ Close</button>
    <form class="form" id="listForm">
      <h2 style="margin:0 0 4px">List your house for rent</h2>
      <p class="addr" style="margin:0">Your listing appears instantly in search results.</p>
      <label for="fTitle">Listing title</label><input id="fTitle" required placeholder="e.g. Renovated 3BR with garden">
      <div class="row">
        <div><label for="fAddr">Street address</label><input id="fAddr" required></div>
        <div><label for="fHood">Neighborhood</label><input id="fHood" required></div>
      </div>
      <div class="row">
        <div><label for="fBoro">Borough</label><select id="fBoro"><option>Brooklyn</option><option>Queens</option><option>Bronx</option><option>Staten Island</option><option>Manhattan</option></select></div>
        <div><label for="fZip">ZIP</label><input id="fZip" required pattern="\\d{5}"></div>
        <div><label for="fType">Type</label><select id="fType"><option>Single family</option><option>Townhouse</option><option>Duplex</option></select></div>
      </div>
      <div class="row">
        <div><label for="fPrice">Rent / month</label><input id="fPrice" type="number" min="100" required></div>
        <div><label for="fBeds">Beds</label><input id="fBeds" type="number" min="0" value="3" required></div>
        <div><label for="fBaths">Baths</label><input id="fBaths" type="number" min="1" step="0.5" value="2" required></div>
        <div><label for="fSqft">Sq ft</label><input id="fSqft" type="number" min="100" value="1500" required></div>
      </div>
      <label>Amenities</label>
      <div class="amen-pick">${Object.entries(AMENITIES).map(([k,v])=>`<label><input type="checkbox" name="am" value="${k}"> ${v}</label>`).join("")}</div>
      <label for="fDesc">Description</label><textarea id="fDesc" rows="4" required></textarea>
      <button class="btn primary" style="margin-top:16px" type="submit">Publish listing</button>
    </form>
  </div>`);
  $("#listForm").addEventListener("submit", e=>{
    e.preventDefault();
    const boro = $("#fBoro").value;
    const [cla,clng] = BORO_LABELS[boro];
    const checked = [...document.querySelectorAll('input[name=am]:checked')].map(i=>i.value);
    const l = {id:Date.now(), title:$("#fTitle").value, addr:$("#fAddr").value, hood:$("#fHood").value, borough:boro, zip:$("#fZip").value,
      price:+$("#fPrice").value, beds:+$("#fBeds").value, baths:+$("#fBaths").value, sqft:+$("#fSqft").value, type:$("#fType").value,
      lat:cla+(Math.random()*0.02-0.01), lng:clng+(Math.random()*0.03-0.015), days:0, hue:Math.floor(Math.random()*360), desc:$("#fDesc").value};
    Object.keys(AMENITIES).forEach(k=>l[k]=checked.includes(k));
    const mine = store.get("hs_user_listings", []); mine.push(l); store.set("hs_user_listings", mine);
    listings.push(l); closeModal(); $("#sort").value="new"; render();
    setTimeout(()=>openDetail(l.id), 50);
  });
}

function showModal(html){ const o=$("#overlay"); o.innerHTML=html; o.hidden=false; document.body.style.overflow="hidden"; }
function closeModal(){ const o=$("#overlay"); o.hidden=true; o.innerHTML=""; document.body.style.overflow=""; }

/* ---------- Events ---------- */
function toggleFav(id){
  id = +id; favs.has(id) ? favs.delete(id) : favs.add(id); store.set("hs_favs",[...favs]);
  track("save", id, favs.has(id));
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>{
    b.setAttribute("aria-pressed", favs.has(id));
    if(b.classList.contains("btn")) b.textContent = favs.has(id) ? "♥ Saved" : "♡ Save house";
  });
  $("#favCount").textContent = favs.size;
  if(onlyFavs) render();
}
document.addEventListener("click", e=>{
  const fav = e.target.closest("[data-fav]"); if(fav){ e.stopPropagation(); toggleFav(fav.dataset.fav); return; }
  if(e.target.closest("[data-close]") || e.target.id==="overlay"){ closeModal(); return; }
  const c = e.target.closest(".card,.pin");
  if(c && !(c.classList.contains("pin") && dragMoved)) openDetail(c.dataset.id);
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeModal();
  if(e.key==="Enter" && e.target.classList?.contains("card")) openDetail(e.target.dataset.id);
});
document.addEventListener("mouseover", e=>{ const c=e.target.closest(".card,.pin"); if(c) highlight(c.dataset.id,true); });
document.addEventListener("mouseout", e=>{ const c=e.target.closest(".card,.pin"); if(c) highlight(c.dataset.id,false); });

$("#searchForm").addEventListener("submit", e=>{ e.preventDefault(); onlyFavs=false; render(); });
["#q","#minPrice","#maxPrice"].forEach(s=>$(s).addEventListener("input", render));
["#beds","#baths","#borough","#sort"].forEach(s=>$(s).addEventListener("change", render));
document.querySelectorAll(".chip").forEach(ch=>ch.addEventListener("click", ()=>{
  const f=ch.dataset.flag; flags.has(f)?flags.delete(f):flags.add(f); ch.setAttribute("aria-pressed",flags.has(f)); render();
}));
document.querySelectorAll(".view-toggle button").forEach(b=>b.addEventListener("click", ()=>{
  document.querySelectorAll(".view-toggle button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  $("#main").className = b.dataset.view==="split" ? "" : b.dataset.view+"-only";
}));
$("#showFavs").addEventListener("click", ()=>{ onlyFavs=!onlyFavs; $("#showFavs").classList.toggle("primary",onlyFavs); render(); });
$("#openList").addEventListener("click", openListForm);
$("#yr").textContent = new Date().getFullYear();

/* ---------- Customer chat ---------- */
const hasTawk = () => !!(CHAT.tawk.propertyId && CHAT.tawk.widgetId);
const waNumber = () => String(CHAT.whatsapp||"").replace(/\D/g,"");
function chatReady(){ return hasTawk() || waNumber().length >= 8; }
let chatAbout = null;   // the house a renter is asking about, if any
function waLink(){
  const msg = chatAbout ? `Hi Hearthstead, I'm interested in ${chatAbout.addr}, ${chatAbout.hood} (${fmt(chatAbout.price)}/mo). Is it still available?`
                        : "Hi Hearthstead, I have a question about renting a house.";
  return `https://wa.me/${waNumber()}?text=${encodeURIComponent(msg)}`;
}
function openLiveChat(){
  if(!window.Tawk_API || !Tawk_API.maximize) { $("#chatNote").textContent = "Live chat is still loading. Try again in a moment."; $("#chatNote").hidden = false; return; }
  if(chatAbout && Tawk_API.addTags) Tawk_API.addTags(["house-" + chatAbout.id], ()=>{});
  Tawk_API.showWidget(); Tawk_API.maximize(); toggleChatMenu(false);
}
function toggleChatMenu(open){
  const m = $("#chatMenu"); open = open ?? m.hidden; m.hidden = !open;
  $("#chatBtn").setAttribute("aria-expanded", open);
  if(open){
    $("#chatAbout").textContent = chatAbout ? `About: ${chatAbout.title}` : "";
    $("#chatAbout").hidden = !chatAbout; $("#chatNote").hidden = true;
    const wa = $("#chatWa"); if(wa) wa.href = waLink();
  }
}
function initChat(){
  if(!chatReady()) return;
  const el = document.createElement("div");
  el.className = "chat";
  el.innerHTML = `
    <div class="chat-menu" id="chatMenu" hidden role="dialog" aria-label="Chat with Hearthstead">
      <b>Chat with Hearthstead</b>
      <p class="fine">Questions about a house, viewings or your application? Message us.</p>
      <p class="chat-about" id="chatAbout" hidden></p>
      ${hasTawk() ? `<button class="btn primary" type="button" id="chatLive">Start live chat</button>` : ""}
      ${waNumber().length >= 8 ? `<a class="btn wa" id="chatWa" target="_blank" rel="noopener noreferrer" href="#">Chat on WhatsApp</a>` : ""}
      ${CHAT.hours ? `<p class="fine">Hours: ${esc(CHAT.hours)}</p>` : ""}
      <p class="fine" id="chatNote" hidden></p>
    </div>
    <button class="chat-btn" id="chatBtn" type="button" aria-expanded="false" aria-controls="chatMenu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg> Chat with us
    </button>`;
  document.body.appendChild(el);
  $("#chatBtn").addEventListener("click", ()=>{ chatAbout = null; toggleChatMenu(); });
  const live = $("#chatLive"); if(live) live.addEventListener("click", openLiveChat);
  if(hasTawk()){
    window.Tawk_API = window.Tawk_API || {}; window.Tawk_LoadStart = new Date();
    Tawk_API.onLoad = () => Tawk_API.hideWidget();             // use our own button instead of tawk's bubble
    Tawk_API.onChatMinimized = () => Tawk_API.hideWidget();
    const s = document.createElement("script"); s.async = true; s.charset = "UTF-8"; s.setAttribute("crossorigin","*");
    s.src = `https://embed.tawk.to/${encodeURIComponent(CHAT.tawk.propertyId)}/${encodeURIComponent(CHAT.tawk.widgetId)}`;
    document.head.appendChild(s);
  }
}
document.addEventListener("click", e=>{
  const b = e.target.closest("[data-chat]"); if(!b) return;
  chatAbout = listings.find(x=>x.id==b.dataset.chat) || null;
  closeModal(); toggleChatMenu(true);
});

buildLand();
render();
initChat();
</script>
